name: Publish compiler comparison to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the comparison and both applications
        run: |
          npm run compare
          npm exec -- vite build --base ./
          npm exec -- ng build --base-href ./
          mkdir -p dist/oxc/angular
          cp -R dist/angular/browser/. dist/oxc/angular/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/oxc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy site
        id: publish
        uses: actions/deploy-pages@v5
